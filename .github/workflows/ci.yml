name: ci

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  node:
    name: node test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  docker-build:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: cp .env.example .env
      - run: docker compose build

  docker-smoke:
    name: docker smoke (boot + healthcheck)
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build
      - name: wait for healthy
        run: |
          for i in $(seq 1 40); do
            cid=$(docker compose ps -q app)
            if [ -z "$cid" ]; then
              echo "container not running"
              docker compose logs app || true
              exit 1
            fi
            status=$(docker inspect --format '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo "no-health")
            echo "attempt $i: $status"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 3
          done
          echo "timed out waiting for healthy"
          docker compose logs app
          exit 1
      - name: show app logs
        if: always()
        run: docker compose logs app || true
      - name: teardown
        if: always()
        run: docker compose down -v

  docker-push:
    name: docker push to ghcr.io
    runs-on: ubuntu-latest
    needs: [node, docker-smoke]
    # Push on commits to main and on semver tag pushes. Skip on PRs and
    # the weekly cron — those are validation only.
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # main pushes  -> :<sha-7>, :edge
          # tag pushes   -> :vX.Y.Z, :X.Y.Z, :X.Y, :latest
          tags: |
            type=sha,prefix=,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bump-manifests:
    name: bump dev image tag in eregion-manifests
    runs-on: ubuntu-latest
    needs: docker-push
    # Only on main branch pushes. Tag pushes (staging promotion) and PRs
    # do not touch any values file — those are immutable artifacts /
    # validation-only.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: checkout eregion-manifests
        uses: actions/checkout@v4
        with:
          repository: awall451/eregion-manifests
          token: ${{ secrets.MANIFESTS_PAT }}
          ref: main
          persist-credentials: true
      - name: bump image.tag
        run: |
          SHORT="${GITHUB_SHA::7}"
          yq -i ".image.tag = \"${SHORT}\"" values/ostinato/dev.yaml
      - name: commit + push
        run: |
          git config user.name  "homelab-ci"
          git config user.email "ci@homelab.local"
          if git diff --quiet -- values/ostinato/dev.yaml; then
            echo "no change — image tag already current"
            exit 0
          fi
          SHORT="${GITHUB_SHA::7}"
          git add values/ostinato/dev.yaml
          git commit -m "ostinato/dev: bump image.tag to ${SHORT}

          Automated by ostinato CI (commit ${GITHUB_SHA})."
          git push
