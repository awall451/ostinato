{{- /*
  SealedSecret rendered from kubeseal-encrypted values. Only emitted
  when:
    - the user did NOT set strava.existingSecret, AND
    - the user did NOT set plain strava.clientId/clientSecret, AND
    - BOTH strava.sealed.clientId and strava.sealed.clientSecret are
      populated.

  Requires the bitnami-labs/sealed-secrets controller in the cluster.
  The controller decrypts this into a native Secret with the same name.
*/}}
{{- if and
    (not .Values.strava.existingSecret)
    (not .Values.strava.clientId)
    .Values.strava.sealed.clientId
    .Values.strava.sealed.clientSecret -}}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ include "ostinato.stravaSecretName" . }}
  labels:
    {{- include "ostinato.labels" . | nindent 4 }}
spec:
  encryptedData:
    STRAVA_CLIENT_ID: {{ .Values.strava.sealed.clientId | quote }}
    STRAVA_CLIENT_SECRET: {{ .Values.strava.sealed.clientSecret | quote }}
  template:
    metadata:
      name: {{ include "ostinato.stravaSecretName" . }}
    type: Opaque
{{- end }}
