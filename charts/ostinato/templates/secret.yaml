{{- /*
  Chart-rendered Secret from plain values. Only emitted when:
    - the user did NOT set strava.existingSecret, AND
    - the user DID set strava.clientId and strava.clientSecret.

  This is the "dev / test only" path — values land in `helm get values`
  in plaintext. For GitOps / production, use existingSecret or the
  SealedSecret template instead.
*/}}
{{- if and (not .Values.strava.existingSecret) .Values.strava.clientId .Values.strava.clientSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ostinato.stravaSecretName" . }}
  labels:
    {{- include "ostinato.labels" . | nindent 4 }}
type: Opaque
stringData:
  STRAVA_CLIENT_ID: {{ .Values.strava.clientId | quote }}
  STRAVA_CLIENT_SECRET: {{ .Values.strava.clientSecret | quote }}
{{- end }}
